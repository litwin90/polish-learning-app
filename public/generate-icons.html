<!DOCTYPE html>
<html>
  <head>
    <title>Generate Icons</title>
  </head>
  <body>
    <h1>Icon Generator for PWA</h1>
    <p>
      Open this file in a browser and use browser dev tools or screenshot to
      generate icons.
    </p>
    <canvas id="favicon16" width="16" height="16"></canvas>
    <canvas id="favicon32" width="32" height="32"></canvas>
    <canvas id="icon192" width="192" height="192"></canvas>
    <canvas id="icon512" width="512" height="512"></canvas>

    <script>
      function drawIcon(canvas, size) {
        const ctx = canvas.getContext("2d");
        // Red background
        ctx.fillStyle = "#DC143C";
        ctx.fillRect(0, 0, size, size);

        // White text "PL"
        ctx.fillStyle = "white";
        ctx.font = `bold ${size * 0.4}px Arial`;
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText("PL", size / 2, size / 2);
      }

      drawIcon(document.getElementById("favicon16"), 16);
      drawIcon(document.getElementById("favicon32"), 32);
      drawIcon(document.getElementById("icon192"), 192);
      drawIcon(document.getElementById("icon512"), 512);

      // Instructions
      console.log(
        'Right-click on each canvas and "Save image as..." to save icons'
      );
    </script>
  </body>
</html>
